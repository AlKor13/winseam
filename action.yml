name: winseam audit
description: >-
  Find the places a Python project misbehaves on Windows -- subprocess(text=True)
  and open() without an encoding, shutil.rmtree without onexc -- as a static pass
  that runs on any runner, including Linux.
author: AlKor13
branding:
  icon: alert-triangle
  color: blue

inputs:
  path:
    description: Path (or space-separated paths) to scan.
    required: false
    default: "."
  fail-on-findings:
    description: Fail the step when anything is found. Set to "false" to report only.
    required: false
    default: "true"
  version:
    description: Version of winseam to install, e.g. "0.1.0". Defaults to the latest.
    required: false
    default: ""
  json-output:
    description: Path to write the findings as JSON. Empty means no file is kept.
    required: false
    default: ""

outputs:
  findings:
    description: Number of findings.
    value: ${{ steps.audit.outputs.findings }}

runs:
  using: composite
  steps:
    - name: Install winseam
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          python -m pip install --quiet "winseam==${{ inputs.version }}"
        else
          python -m pip install --quiet winseam
        fi

    - name: Audit
      id: audit
      shell: bash
      run: |
        # Relative filenames only. An absolute POSIX path such as /tmp/... is handed to a
        # Windows interpreter verbatim, where it resolves to C:\tmp and does not exist --
        # which is how this step used to report an empty count on windows runners.
        report="winseam-audit-$GITHUB_RUN_ID.json"

        set +e
        winseam audit ${{ inputs.path }}
        status=$?
        set -e

        # `winseam audit` exits 1 when it finds anything, which is what the human-readable
        # run above is for. This second pass only produces the count, so it must not be the
        # thing that decides the step's fate: --exit-zero, or `set -e` kills it here.
        winseam audit ${{ inputs.path }} --json --exit-zero > "$report"
        count=$(python -c "import json,sys;print(len(json.load(open(sys.argv[1], encoding='utf-8'))))" "$report")

        echo "findings=$count" >> "$GITHUB_OUTPUT"
        echo "### winseam audit: $count finding(s)" >> "$GITHUB_STEP_SUMMARY"

        if [ -n "${{ inputs.json-output }}" ]; then
          mkdir -p "$(dirname "${{ inputs.json-output }}")"
          mv "$report" "${{ inputs.json-output }}"
        else
          rm -f "$report"
        fi

        if [ "${{ inputs.fail-on-findings }}" = "true" ]; then
          exit $status
        fi
